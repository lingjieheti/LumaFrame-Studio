name: Windows desktop smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6-Essentials==6.9.3
      - run: python -m compileall -q -x "(/|\\)\.git" .
      - run: python tests/test_desktop.py
      - run: python tests/test_formats.py
